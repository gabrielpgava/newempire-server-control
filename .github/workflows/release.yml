name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Minimum bump (never lowers a conventional-commit bump)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      channel:
        description: Stable publication or an opt-in prerelease
        type: choice
        options: [stable, beta, rc]
        default: stable
      retry_tag:
        description: Explicit failed draft tag to resume (requires separate run authorization)
        type: string
        default: ''

permissions:
  contents: read

# Never interrupt a draft upload or publication. Stale main SHAs fail closed.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare unsigned release
    if: github.event_name == 'workflow_dispatch' && github.repository == 'gabrielpgava/newempire-server-control' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      artifact_name: unsigned-release-${{ github.sha }}-${{ github.run_attempt }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check protected main and plan version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-bundle"
          python3 -B scripts/release.py plan --live --output "$RUNNER_TEMP/release-bundle/plan.json"
      - name: Build embedded UI, both Linux packages and SBOM
        if: steps.plan.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: make dist VERSION="$RELEASE_VERSION" OUT="$RUNNER_TEMP/release-bundle/assets"
      - name: Transfer only this run's unsigned packages
        if: steps.plan.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-bundle/plan.json
            ${{ runner.temp }}/release-bundle/assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified release
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject unprotected or stale main before requesting the signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release.py guard
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-bundle
      - name: Build signer from this fresh checkout, never the preparation artifact
        run: go build -mod=readonly -o "$RUNNER_TEMP/release-tool" ./scripts/release
      - name: Sign manifest (required, no unsigned fallback)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: '"$RUNNER_TEMP/release-tool" sign -dir "$RUNNER_TEMP/release-bundle/assets"'
      - name: Attest all payload assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-bundle/assets/*
      - name: Draft, upload, read back, verify, then publish last
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/release-bundle/assets/provenance.jsonl"
          python3 -B scripts/release.py publish --plan "$RUNNER_TEMP/release-bundle/plan.json" --assets "$RUNNER_TEMP/release-bundle/assets" --tool "$RUNNER_TEMP/release-tool"

openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: New Empire Server Control API
  version: unreleased
  summary: Authenticated management of isolated Minecraft Java/Fabric instances.
  description: |
    Source-available under PolyForm Shield 1.0.0. This reference describes the
    current application integration; an unreleased schema is not a
    published-version or live-deployment acceptance claim.

    JSON uses snake_case. Application lists are arrays, including empty lists;
    optional upstream discovery arrays may be null as specified. Timestamps are
    Unix seconds unless a field explicitly uses date-time. JSON requests reject
    unknown fields and must contain exactly one object with Content-Type
    application/json. Ordinary JSON errors are {error: string}. tus protocol and
    standard HTTP range errors may be plain text, as documented on those routes.

    The nec_session cookie is HTTP-only, SameSite=Strict, expires after 12 hours,
    and is Secure on HTTPS. Authenticated mutations require both Origin matching
    the configured public_url and X-CSRF-Token from GET /api/v1/auth/session.
    Setup/login require matching Origin without a pre-existing session. This API
    is same-origin; no bearer-token or cross-origin administration is implied.
    The separately documented /internal/health route is a loopback-only machine
    probe for the independent updater, not a user administration token API.

    Roles are cumulative: owner > admin > operator > viewer. Owners/admins can
    access all instances; operators/viewers need explicit instance grants.
    Unauthorized instance/job lookups return 404 to avoid disclosing existence.
    Per-operation x-minimum-role values supplement, not replace, instance grants.

    HTTP 202 means a durable job was accepted, never that the requested operation
    completed. Poll GET /api/v1/jobs/{jobID} and inspect job.state, job.error,
    job.result, and steps. Mutations serialize per instance; panel-wide jobs
    exclude concurrent instance work. Cancellation is safe-point based and can
    be refused after a commit barrier. Content failure never authorizes an
    implicit world rollback. No Paper/Purpur plugin or Docker runtime provider
    is exposed by this contract.
  license:
    name: PolyForm Shield 1.0.0 (source-available)
    url: https://polyformproject.org/licenses/shield/1.0.0
servers:
  - url: /
    description: Same origin as the embedded panel.
security:
  - sessionCookie: []
tags:
  - {name: Health, description: Minimal liveness and authenticated diagnostics.}
  - {name: Authentication, description: Protected setup and cookie sessions.}
  - {name: Instances, description: 'Creation, adoption, status, and lifecycle.'}
  - {name: Files, description: 'Confined files, staging, imports, and recovery.'}
  - {name: Uploads, description: Owner-checked tus 1.0 resumable staging.}
  - {name: Backups, description: Verified archives and explicit restores.}
  - {name: Worlds, description: World selection and safe server properties.}
  - {name: Players, description: Minecraft moderation and access records.}
  - {name: Content, description: Fabric mods and explicit content plans.}
  - {name: Runtime, description: Upstream Fabric metadata and allowlisted Java.}
  - {name: Jobs, description: Durable execution and safe cancellation.}
  - {name: Automation, description: Timezone-aware schedules and invalidations.}
  - {name: Administration, description: 'Users, redacted settings, and audit.'}
  - {name: Updates, description: Official signed panel-release workflows.}
paths:
  /healthz:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Read minimal public liveness
      description: Does not disclose version, instance state, or database details.
      security: []
      responses:
        '200':
          description: HTTP process is responding.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Liveness'}
  /internal/health:
    get:
      operationId: getUpdaterHealth
      tags: [Health]
      summary: Probe panel identity/database from the independent local updater
      description: |
        Internal machine endpoint, not a browser login or public readiness API.
        Requires the protected local data_dir/health-token as Authorization
        Bearer and a physical loopback peer address. A proxy is not permission
        to expose this probe remotely. The token is never returned by HTTP.
      x-internal: true
      security:
        - updaterHealthToken: []
      responses:
        '200':
          description: Running panel version without a leading v, and database schema.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      tags: [Authentication]
      summary: Check whether first-owner setup is required
      description: Never returns the protected local bootstrap token.
      security: []
      responses:
        '200':
          description: Setup requirement.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupStatus'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createFirstOwner
      tags: [Authentication]
      summary: Complete token-protected first-owner setup
      description: |
        The token is read locally from data_dir/setup-token, never from HTTP.
        Creates the first owner, consumes the token, and signs in. No default
        account or unauthenticated administrator mode exists. Passwords are
        12–1024 bytes; setup is closed after the first user is created.
      security: []
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      responses:
        '201': {$ref: '#/components/responses/SessionCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in with password and optional TOTP code
      security: []
      parameters:
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/SessionCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [Authentication]
      summary: Read the current user and CSRF token
      x-minimum-role: viewer
      responses:
        '200':
          description: The raw session cookie token is not serialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Invalidate the current session and expire its cookie
      x-minimum-role: viewer
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/totp:
    post:
      operationId: enrollTOTP
      tags: [Authentication]
      summary: Generate a TOTP secret or confirm enrollment for the current user
      description: |
        Send {} to generate a secret. Send password, that secret, and a valid
        code to enable TOTP for this account only. Successful enrollment revokes
        all of this user's sessions, including the current session; sign in
        again. An existing enrollment cannot be replaced without first disabling
        it using the password and a valid current code. All account-security
        routes share a per-user limit of ten requests per 15-minute window,
        including secret generation; throttling state is process-local.
      x-minimum-role: viewer
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPRequest'}
      responses:
        '200':
          description: Newly generated secret or enrollment confirmation.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/TOTPSecret'}
                  - {$ref: '#/components/schemas/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      operationId: disableTOTP
      tags: [Authentication]
      summary: Disable the current user's TOTP with password and code
      description: |
        Self-service for every role. Requires the current password and a valid
        code from the existing authenticator; no target user or administrator
        override is accepted. Success revokes all of this user's sessions,
        including the current session. Sign in again. Shares the account-security
        request limit with enrollment and password changes.
      x-minimum-role: viewer
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TOTPDisableRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the current user's password and revoke all their sessions
      description: |
        Self-service for every role, not a reset of another user's password.
        Requires current_password and a new_password of 12–1024 UTF-8 bytes
        (not characters). Success revokes all of this user's sessions, including
        the current session. Sign in again with the new password and the existing
        TOTP code if enabled. Shares the account-security request limit with
        TOTP enrollment and disablement.
      x-minimum-role: viewer
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check database availability and read panel build/schema identity
      x-minimum-role: viewer
      responses:
        '200':
          description: Database reachable; not a Minecraft readiness check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/events:
    get:
      operationId: getEvents
      tags: [Automation]
      summary: Subscribe to periodic server-sent invalidations
      description: |
        Checks a process-local revision approximately every three seconds. Emits
        event: invalidate with that revision initially and when it changes;
        otherwise sends a heartbeat comment. Data is not a timestamp. Refetch
        authorized state; no event replay, durable delivery, Last-Event-ID
        support, or operation-completion guarantee is implied.
      x-minimum-role: viewer
      responses:
        '200':
          description: Long-lived same-origin SSE stream.
          headers:
            X-Accel-Buffering: {schema: {type: string, const: 'no'}}
          content:
            text/event-stream:
              schema: {type: string}
              example: "event: invalidate\ndata: 42\n\n"
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/instances:
    get:
      operationId: listInstances
      tags: [Instances]
      summary: List instances visible to the current user
      x-minimum-role: viewer
      responses:
        '200':
          description: Filtered inventory; credentials are never serialized.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Instance'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createInstance
      tags: [Instances]
      summary: Queue creation, staged import, or allowlisted adoption
      description: |
        Every mode needs explicit EULA acceptance, versions, an allowlisted Java
        path, memory, and distinct unprivileged game/RCON ports. Import/adopt
        require a matching preview_hash and explicit safe detected launcher.
        Adopt never silently rewrites external files or unsafe RCON settings.
        The accepted job reserves instance_id; successful result.instance is the
        created record. Service provisioning/firewall requirements remain real
        host prerequisites, not simulated successes.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInstanceRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/adoptions:
    get:
      operationId: listAdoptionRoots
      tags: [Instances]
      summary: List administrator-allowlisted host roots
      description: Roots are host configuration, not unrestricted filesystem access.
      x-minimum-role: admin
      responses:
        '200':
          description: Allowlisted roots.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdoptionRoots'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/adoptions/preview:
    post:
      operationId: previewAdoption
      tags: [Instances]
      summary: Inspect an existing allowlisted directory without adopting it
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdoptionPreviewRequest'}
      responses:
        '200': {$ref: '#/components/responses/ImportPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/imports/preview:
    post:
      operationId: previewInitialImport
      tags: [Files]
      summary: Inspect a completed upload before creating an instance
      description: Upload must belong to the current user and be complete/unexpired.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
      requestBody: {$ref: '#/components/requestBodies/UploadPreview'}
      responses:
        '200': {$ref: '#/components/responses/ImportPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/instances/{instanceID}:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: getInstance
      tags: [Instances]
      summary: Read a permitted instance without credentials
      x-minimum-role: viewer
      responses:
        '200':
          description: Instance metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Instance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/instances/{instanceID}/status:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: getInstanceStatus
      tags: [Instances]
      summary: Read runtime state and Minecraft readiness
      description: |
        A process alone is not ready. Runtime errors produce state unknown,
        ready false, and detail in the 200 response rather than invented metrics.
      x-minimum-role: viewer
      responses:
        '200':
          description: Current observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuntimeStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/instances/{instanceID}/logs:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: getInstanceLogs
      tags: [Instances]
      summary: Read up to 200 recent runtime log lines
      description: No arbitrary journal query or log-limit parameter is supported.
      x-minimum-role: viewer
      responses:
        '200':
          description: Bounded log lines; known RCON secret is redacted.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/LogLine'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/instances/{instanceID}/metrics:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: getInstanceMetrics
      tags: [Instances]
      summary: Read up to 288 newest recorded runtime samples
      description: Samples are approximately minute-spaced; unavailable measurements are not invented.
      x-minimum-role: viewer
      responses:
        '200':
          description: Newest-first samples; no arbitrary time-range query is supported.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Metric'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/instances/{instanceID}/actions/{action}:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
      - name: action
        in: path
        required: true
        schema: {type: string, enum: [start, stop, restart, backup]}
    post:
      operationId: queueLifecycleAction
      tags: [Instances]
      summary: Queue a validated lifecycle action or default offline backup
      description: |
        Start/restart wait for Minecraft readiness in the job. Use POST /backups
        for a note or coordinated-online selection. No shell commands or arbitrary
        service names are accepted. Request body is not used.
      x-minimum-role: operator
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/instances/{instanceID}/console:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    post:
      operationId: queueConsoleCommand
      tags: [Instances]
      summary: Queue one Minecraft command; read result.output after success
      description: |
        Not a host shell. Operators are restricted to list, say, kick, whitelist
        add/remove/list, ban, pardon, and save-all. Other commands need admin.
        stop/save-off/save-on are forbidden; use lifecycle/coordinated backups.
        RCON protocol limits may reject input below the outer 4096-byte limit.
      x-minimum-role: operator
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsoleRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/instances/{instanceID}/files:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: listFiles
      tags: [Files]
      summary: List or search a confined relative directory
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/DirectoryPath'}
        - name: q
          in: query
          description: Optional case-insensitive recursive filename search, limited to 200 results.
          schema: {type: string}
      responses:
        '200':
          description: Direct children when q is omitted; matching recursive entries when supplied.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FileEntry'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: mutateFiles
      tags: [Files]
      summary: Queue a file edit, directory creation, move, trash, or recovery
      description: |
        Minecraft must already be stopped; this job rejects a running instance
        rather than silently stopping it. All paths are confined instance-relative
        paths. Existing text edits need
        the preview etag; stale data is rejected. Trash retains data in external
        recovery. Recover uses the retained token/original path and must not
        overwrite a destination. No direct permanent-delete or arbitrary-shell
        operation is exposed. Required backup/shutdown checks run in the job.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileMutationRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/instances/{instanceID}/file:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: getFile
      tags: [Files]
      summary: Download a confined regular file or preview bounded UTF-8 text
      description: |
        preview=true returns JSON with an etag for a later write. Sensitive
        files and unsafe links/special files are rejected. Without preview the
        response is bytes, not JSON. A general download is not a consistent backup.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/FilePath'}
        - name: preview
          in: query
          schema: {type: boolean, default: false}
        - {$ref: '#/components/parameters/Range'}
      responses:
        '200':
          description: Text preview JSON or downloaded file bytes.
          headers:
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TextPreview'}
            application/octet-stream:
              schema: {type: string, format: binary}
        '206': {$ref: '#/components/responses/PartialDownload'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/instances/{instanceID}/export:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: exportFiles
      tags: [Files]
      summary: Stream a confined directory or path as ZIP
      description: |
        Not a coordinated online backup. Use the backup workflow for consistent
        world copies. A streaming failure may terminate the response rather
        than append a JSON error to an already-started ZIP.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/DirectoryPath'}
      responses:
        '200':
          description: ZIP stream.
          headers:
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
          content:
            application/zip:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/instances/{instanceID}/recovery:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: listRecovery
      tags: [Files]
      summary: List retained deleted paths for this instance
      description: Restore through POST /files with operation recover, token, and confirm true.
      x-minimum-role: admin
      responses:
        '200':
          description: External recovery entries; not a general backup catalog.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RecoveryEntry'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

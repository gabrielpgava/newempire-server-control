      - {$ref: '#/components/parameters/BackupID'}
    post:
      operationId: fetchOffsiteBackup
      tags: [Backups]
      summary: Queue a trusted offsite archive download for later local use
      description: |
        Requires a saved restoration record matching this instance, backup ID,
        trusted SHA-256, and size; does not discover arbitrary bucket objects or
        trust a digest from remote metadata alone. Downloads without overwriting
        an existing local archive, checks every byte against the trusted record,
        recreates local catalog/instance sidecars, and verifies the archive and

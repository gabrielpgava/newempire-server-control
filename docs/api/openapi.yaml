        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/uploads/:
    options:
      operationId: getUploadCapabilities
      tags: [Uploads]
      summary: Discover authenticated tus staging capabilities
      x-minimum-role: admin
      responses:
        '204': {$ref: '#/components/responses/TusCapabilities'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
    post:
      operationId: createUpload
      tags: [Uploads]
      summary: Reserve a fixed-length resumable upload in private staging
      description: |
        tus 1.0 creation: filename metadata is required and base64 encoded.
        No deferred length, concatenation, or upload download is supported.
        Uploaded bytes do not enter an instance until a separate reviewed job.
        Upload IDs are owned by the creating user, quota-reserved, and expiring.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/TusResumable'}
        - name: Upload-Length
          in: header
          required: true
          description: Total byte length; fixed at creation and constrained by host quota.
          schema: {type: integer, format: int64, minimum: 0}
        - name: Upload-Metadata
          in: header
          required: true
          description: Comma-separated tus metadata; must include a safe filename.
          schema: {type: string, maxLength: 4096}
          example: filename c2VydmVyLnppcA==
      responses:
        '201':
          description: Staging reservation created; empty body.
          headers:
            Location:
              description: URL of the owned upload resource.
              schema: {type: string, format: uri-reference}
            Tus-Resumable: {$ref: '#/components/headers/TusResumable'}
            Upload-Expires: {$ref: '#/components/headers/UploadExpires'}
        '400': {$ref: '#/components/responses/UploadError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '412': {$ref: '#/components/responses/TusVersionError'}
        '413': {$ref: '#/components/responses/UploadTooLarge'}
        '503': {$ref: '#/components/responses/UploadUnavailable'}
  /api/v1/uploads/{uploadID}:
    parameters:
      - {$ref: '#/components/parameters/UploadID'}
    options:
      operationId: getUploadResourceCapabilities
      tags: [Uploads]
      summary: Discover tus capabilities for an owned upload
      x-minimum-role: admin
      responses:
        '204': {$ref: '#/components/responses/TusCapabilities'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/UploadNotFound'}
    head:
      operationId: getUploadOffset
      tags: [Uploads]
      summary: Read a complete or partial upload's authoritative byte offset
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/TusResumable'}
      responses:
        '200':
          description: No body; resume from Upload-Offset, not a guessed client offset.
          headers:
            Tus-Resumable: {$ref: '#/components/headers/TusResumable'}
            Upload-Offset: {$ref: '#/components/headers/UploadOffset'}
            Upload-Length:
              schema: {type: integer, format: int64, minimum: 0}
            Upload-Metadata:
              description: Original safe filename in tus metadata encoding.
              schema: {type: string}
            Upload-Expires: {$ref: '#/components/headers/UploadExpires'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/UploadNotFound'}
        '412': {$ref: '#/components/responses/TusVersionError'}
    patch:
      operationId: appendUpload
      tags: [Uploads]
      summary: Append bytes at the server-confirmed upload offset
      description: Resume using HEAD after an interrupted request. Completion is offset equal to length, not import success.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/TusResumable'}
        - name: Upload-Offset
          in: header
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: {type: string, format: binary}
      responses:
        '204':
          description: Bytes durably accepted; no body.
          headers:
            Tus-Resumable: {$ref: '#/components/headers/TusResumable'}
            Upload-Offset: {$ref: '#/components/headers/UploadOffset'}
            Upload-Expires: {$ref: '#/components/headers/UploadExpires'}
        '400': {$ref: '#/components/responses/UploadError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/UploadNotFound'}
        '409': {$ref: '#/components/responses/UploadOffsetConflict'}
        '412': {$ref: '#/components/responses/TusVersionError'}
        '413': {$ref: '#/components/responses/UploadTooLarge'}
        '423': {$ref: '#/components/responses/UploadLocked'}
        '500': {$ref: '#/components/responses/UploadError'}
    delete:
      operationId: terminateUpload
      tags: [Uploads]
      summary: Delete an owned staged upload without touching an instance
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/TusResumable'}
      responses:
        '204':
          description: Staged upload removed; no body.
          headers:
            Tus-Resumable: {$ref: '#/components/headers/TusResumable'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/UploadForbidden'}
        '404': {$ref: '#/components/responses/UploadNotFound'}
        '412': {$ref: '#/components/responses/TusVersionError'}
        '423': {$ref: '#/components/responses/UploadLocked'}
        '500': {$ref: '#/components/responses/UploadError'}
  /api/v1/instances/{instanceID}/backups:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
    get:
      operationId: listBackups
      tags: [Backups]
      summary: List the permitted instance's backup catalog
      description: |
        Combines local catalog records with trusted saved offsite records.
        local false means the archive must be fetched before local verification,
        preview, download, or restore. verified records creation-time integrity;
        neither it nor offsite metadata rechecks local or remote bytes on listing.
      x-minimum-role: viewer
      responses:
        '200':
          description: Catalog entries, not proof of an independently tested restore.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Backup'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createBackup
      tags: [Backups]
      summary: Queue an offline or explicitly coordinated-online backup
      description: |
        Offline is the default: stops a running instance, confirms shutdown, and
        attempts to restart it afterward. online true requires a ready runtime
        with authenticated RCON; issues save-off and save-all flush, then attempts
        save-on even after failure/cancellation. This is Minecraft save
        coordination, not a transactional snapshot of every mod's private data.
        The job also replicates the completed backup when offsite storage is
        enabled; offsite failure leaves the verified local backup available.
      x-minimum-role: operator
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:

        administrator confirmation remain separate. Request body is not used.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/instances/{instanceID}/backups/{backupID}/restore:
    parameters:
      - {$ref: '#/components/parameters/InstanceID'}
      - {$ref: '#/components/parameters/BackupID'}
    post:
      operationId: restoreBackup
      tags: [Backups]
      summary: Queue an explicitly confirmed restore after preview
      description: |
        Admin decision separate from content/runtime rollback. A 202 only queues
        the job. Before stopping Minecraft or replacing data, it fully verifies
        the archive and requires valid BACKUP_ID.instance.json with matching
        instance ID, root, game/RCON ports, adoption mode, and allowlisted safe
        configuration. Missing, malformed, foreign, or unsafe metadata fails the
        job without stopping or changing the instance.

        After preflight it checks space, stops Minecraft if necessary, creates a
        verified pre-restore backup, validates same-filesystem staging, and swaps
        data under the instance lock and commit barrier, retaining the original.
        Archived Java path, launcher JAR, or memory changes trigger restricted
        service-helper reconfiguration before the instance record is updated.
        Minecraft remains stopped for review. Inspect result.restore even on
        failure; a post-swap helper/database error does not undo restored worlds.
      x-minimum-role: admin
      parameters:
        - {$ref: '#/components/parameters/Origin'}
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/Confirmation'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
